[package]
name = "pickcat-api-collection"
version = "0.1.4"
edition = "2024"
description="PickcatAPI合集"
license="MIT"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", features = ["cookies", "json", "query", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.1"

[dev-dependencies]
dotenvy = "0.15.7"
env_logger = "0.11.11"
log = "0.4.34"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
wiremock = "0.6"
